{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">📋</div>
        <h1 class="login-title">MJ Limited</h1>
        <p class="login-subtitle">Internal Task Portal</p>
        {% if error %}
        <div class="form-error-msg">{{ error }}</div>
        {% endif %}
        <form method="post" novalidate>
            <div class="form-field">
                <label for="email" class="field-label">Email Address</label>
                <input type="email" id="email" name="email" class="text-input" placeholder="you@mj.com" autofocus required>
            </div>
            <div class="form-field">
                <label for="password" class="field-label">Password</label>
                <input type="password" id="password" name="password" class="text-input" placeholder="Your password" required>
            </div>
            <button type="submit" class="submit-btn full-width">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
